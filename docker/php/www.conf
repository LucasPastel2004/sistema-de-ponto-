; ─── PHP-FPM Pool Configuration ─────────────────────────────────────────
; Otimizado para ambiente Docker/Windows com Filament

[www]

; Gerenciamento de processos
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Recicla workers após N requests para evitar memory leaks
pm.max_requests = 500

; Timeout por request (deve ser >= max_execution_time do PHP)
request_terminate_timeout = 120s

; Status do FPM (útil para monitorar)
pm.status_path = /fpm-status

; Ping para health check
ping.path = /fpm-ping
ping.response = pong

