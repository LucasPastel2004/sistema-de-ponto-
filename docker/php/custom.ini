; ─── Custom PHP Settings for Sistema de Ponto ──────────────────────────

; Timezone
date.timezone = America/Sao_Paulo

; Upload limits
upload_max_filesize = 10M
post_max_size = 12M

; Memory
memory_limit = 512M

; Execution — aumentado para Filament boot em Docker/Windows
max_execution_time = 120
max_input_time = 120

; Error handling (dev)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/php/error.log

; Session security
; ATENÇÃO: cookie_secure = 0 em desenvolvimento (HTTP local)
; Em produção (HTTPS), mudar para 1
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 7200

; Security
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
