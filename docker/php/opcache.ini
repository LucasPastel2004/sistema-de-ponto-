; ─── OPcache Configuration (otimizado para Docker/Windows) ─────────────

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; CRÍTICO para performance no Docker/Windows:
; validate_timestamps=0 desativa o stat() nos arquivos em disco
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; Cache de realpath maior para Filament (muitos arquivos)
realpath_cache_size = 16384k
realpath_cache_ttl = 600
