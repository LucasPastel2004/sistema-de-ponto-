; ─── OPcache Configuration (otimizado para Docker/Windows) ─────────────

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; CRÍTICO para performance no Docker/Windows:
; validate_timestamps=1 + revalidate_freq=0 faz stat() em cada arquivo
; em CADA request — extremamente lento em volumes montados no Windows.
; Definir revalidate_freq=2 reduz para 1 check a cada 2 segundos.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; Cache de realpath maior para Filament (muitos arquivos)
realpath_cache_size = 8192k
realpath_cache_ttl = 600
