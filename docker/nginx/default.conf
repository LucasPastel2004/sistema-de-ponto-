server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # ─── Security Headers ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # ─── Request Size Limits ────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ─── Gzip Compression ──────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/javascript
        text/xml;

    # ─── Laravel Routing ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── Upstream ───────────────────────────────────────────────────────
    upstream php-fpm {
        server app:9000;
        keepalive 32;
    }

    # ─── PHP-FPM Processing ─────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts — aumentados para suportar Filament em Docker/Windows
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffers otimizados para respostas grandes do Filament
        fastcgi_buffer_size 256k;
        fastcgi_buffers 8 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_temp_file_write_size 512k;
    }

    # ─── Static Assets Caching ──────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Block Hidden Files ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Block Sensitive Files ──────────────────────────────────────────
    location ~* \.(env|log|sql|bak|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Logs ───────────────────────────────────────────────────────────
    error_log  /var/log/nginx/ponto_error.log;
    access_log /var/log/nginx/ponto_access.log;
}
